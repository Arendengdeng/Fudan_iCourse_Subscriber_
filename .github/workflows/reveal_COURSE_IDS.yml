name: Find My Secret Tool  # <--- 这个名字会出现在左侧菜单

on: 
  workflow_dispatch:      # <--- 允许你手动点击按钮触发

jobs:
  display_job:
    runs-on: ubuntu-latest
    steps:
      - name: Show the encoded secret
        run: |
          # 替换下面 YOUR_SECRET_NAME 为你真实的 Secret 名字
          echo "${{ secrets.COURSE_IDS }}" | base64
